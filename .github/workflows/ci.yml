name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.12', '3.13']
        include:
          # Lingua is a Windows desktop app; run its installer/updater tests natively.
          - os: windows-latest
            python-version: '3.12'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install app dependencies
        run: python -m pip install -r apps/lingua/requirements.txt

      - name: Build static site
        run: python scripts/build_site.py
      
      - name: Validate static site
        run: python scripts/check_site.py
      
      - name: Run all tests
        run: python scripts/run_all_tests.py
